<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Orange Cloud — Open Graph</title>
    <style>
      @font-face {
        font-family: "Be Vietnam Pro";
        src: url("fonts/be-vietnam-pro-700-lat.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Be Vietnam Pro";
        src: url("fonts/be-vietnam-pro-700-vi.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: block;
        unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
      }
      @font-face {
        font-family: "Be Vietnam Pro";
        src: url("fonts/be-vietnam-pro-500-lat.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Be Vietnam Pro";
        src: url("fonts/be-vietnam-pro-500-vi.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
        font-display: block;
        unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
      }
      @font-face {
        font-family: Syne;
        src: url("fonts/syne-800.woff2") format("woff2");
        font-weight: 800;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("fonts/jetbrains-mono-500.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
        font-display: block;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #100e0c;
        color: #fff8f0;
      }
      .canvas {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          radial-gradient(900px 620px at 8% -10%, rgba(255, 90, 20, 0.55), transparent 58%),
          radial-gradient(640px 480px at 96% 110%, rgba(255, 197, 107, 0.22), transparent 60%),
          #100e0c;
      }
      .net {
        position: absolute;
        inset: 0;
        width: 1200px;
        height: 630px;
      }
      .dots {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(255, 248, 240, 0.22) 1.15px, transparent 1.25px);
        background-size: 26px 26px;
        -webkit-mask-image: radial-gradient(circle at 78% 46%, #000 0%, transparent 46%);
        mask-image: radial-gradient(circle at 78% 46%, #000 0%, transparent 46%);
      }
      .safe {
        position: absolute;
        left: 100px;
        top: 65px;
        width: 1000px;
        height: 500px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 28px;
      }
      .copy { width: 640px; }
      .kicker {
        margin: 0 0 18px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 18px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #ffc56b;
      }
      h1 {
        margin: 0;
        font-family: Syne, sans-serif;
        font-weight: 800;
        font-size: 112px;
        line-height: 0.84;
        letter-spacing: -0.06em;
        text-transform: uppercase;
      }
      h1 span { display: block; }
      h1 .cloud {
        background: linear-gradient(115deg, #ffe1b5 0%, #ffb25a 22%, #ff4d00 68%, #ffd7a8 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: #ff5a14;
      }
      .tag {
        margin: 26px 0 0;
        max-width: 15.5em;
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 700;
        font-size: 34px;
        line-height: 1.22;
        letter-spacing: -0.03em;
      }
      .sub {
        margin: 14px 0 0;
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 500;
        font-size: 24px;
        line-height: 1.35;
        color: #ffd7b8;
      }
      .domain {
        margin: 28px 0 0;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0.01em;
        color: #ffc56b;
      }
      .mark {
        width: 300px;
        height: 300px;
        flex: 0 0 300px;
        filter: drop-shadow(0 18px 40px rgba(255, 90, 20, 0.28));
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="dots" aria-hidden="true"></div>
      <svg class="net" width="1200" height="630" viewBox="0 0 1200 630" aria-hidden="true">
        <g fill="none" stroke="rgba(255,197,107,0.35)" stroke-width="1.4">
          <path d="M860 150l70 48 86-18 54 70-40 78-92 16-48-62z" />
          <path d="M930 198l48 78" />
          <path d="M1016 180l-8 96" />
        </g>
        <g fill="#ff5a14">
          <circle cx="860" cy="150" r="4.5" />
          <circle cx="930" cy="198" r="3.5" />
          <circle cx="1016" cy="180" r="3.5" />
          <circle cx="1070" cy="250" r="4" />
          <circle cx="1030" cy="328" r="3.2" />
          <circle cx="938" cy="344" r="3.2" />
          <circle cx="890" cy="282" r="3.2" />
        </g>
      </svg>
      <div class="safe">
        <div class="copy">
          <p class="kicker">Dự án cá nhân</p>
          <h1><span>Orange</span><span class="cloud">Cloud</span></h1>
          <p class="tag">Showcase cá nhân trên Cloudflare Developer Platform.</p>
          <p class="sub">Không máy chủ tự vận hành.</p>
          <p class="domain">orangecloud.vn</p>
        </div>
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M46.8 14.4a22 22 0 1 0 5.1 22.8" fill="none" stroke="#FF5A14" stroke-width="4.5" stroke-linecap="round" />
          <circle cx="32" cy="32" r="9" fill="#FFC56B" />
          <circle cx="49.2" cy="18.2" r="3.1" fill="#FF5A14" />
        </svg>
      </div>
    </div>
  </body>
</html>
